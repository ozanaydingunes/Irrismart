<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>IrriGrow</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="splash"><img src="img/logo.png" alt="IrriGrow"></div>
<header class="top">
  <button class="icon" id="btnBack" aria-label="Projeler">☰</button>
  <div class="ttl"><img src="img/logo.png" alt="IrriGrow" class="logo"><span id="projName"></span></div>
  <button class="icon" id="btnSettings" aria-label="Ayarlar">⚙</button>
</header>

<main>
  <!-- PROJELER -->
  <section class="view" id="v-projeler">
    <div class="pad">
      <div class="hero"><img src="img/logo.png" alt="IrriGrow"><span data-i18n>Akıllı damla sulama projelendirme</span><span id="heroLang"></span></div>
      <button class="btn primary block" id="btnNew">＋ <span data-i18n>Yeni proje</span></button>
      <div id="projList"></div>
      <p class="muted small center" data-i18n>Projeler bu cihazda saklanır. Telefon değişmeden veya uygulama silinmeden önce yedek alın.</p>
      <div class="row"><button class="btn" style="flex:1" id="btnBackup">⤓ <span data-i18n>Yedekle</span></button><label class="btn" style="flex:1;flex-direction:row;justify-content:center;margin:0">⤒ <span data-i18n>Yedekten yükle</span><input type="file" id="restoreFile" accept=".json,application/json" style="display:none"></label></div>
    </div>
  </section>

  <!-- ARAZİ -->
  <section class="view" id="v-arazi">
    <div id="map"></div>
    <div class="mapbar">
      <div class="mapinfo" id="mapInfo"></div>
      <div class="seg" id="mModes">
        <button data-m="sinir"><span data-i18n>Sınır</span></button>
        <button data-m="kaynak"><span data-i18n>Kaynak</span></button>
        <button data-m="istasyon"><span data-i18n>İstasyon</span></button>
        <button data-m="anahat"><span data-i18n>Ana hat</span></button>
        <button data-m="shift">Shift</button>
      </div>
      <div class="row wrap" id="mShiftBar" style="display:none;margin-bottom:6px;align-items:center;gap:6px"></div>
      <div class="row wrap">
        <button class="btn sm" id="mUndo">↶ <span data-i18n>Geri</span></button>
        <button class="btn sm" id="mClear"><span data-i18n>Temizle</span></button>
        <button class="btn sm" id="mGps">◎</button>
        <button class="btn sm" id="mPlan"><span data-i18n>Plan</span></button>
        <button class="btn sm" id="mFull">⤢</button>
        <button class="btn sm primary" id="mApply"><span data-i18n>Uygula</span></button>
      </div>
    </div>
  </section>

  <!-- VERİLER -->
  <section class="view" id="v-veri"><form class="pad" id="form" autocomplete="off"></form></section>

  <!-- SONUÇ -->
  <section class="view" id="v-sonuc"><div class="pad" id="result"></div></section>

  <!-- MALZEME -->
  <section class="view" id="v-malzeme"><div class="pad" id="bom"></div></section>

  <!-- HİDROLİK HESAP TABLOSU -->
  <section class="view" id="v-hidrolik"><div class="pad wide" id="hydro"></div></section>

  <!-- TEKNİK PROJE -->
  <section class="view" id="v-teknik"><div class="pad wide" id="tech"></div></section>

  <!-- AYARLAR -->
  <section class="view" id="v-ayarlar"><div class="pad" id="settings"></div></section>
</main>

<nav class="tabs">
  <button data-v="projeler"><i>▤</i><span data-i18n>Projeler</span></button>
  <button data-v="arazi"><i>◫</i><span data-i18n>Arazi</span></button>
  <button data-v="veri"><i>✎</i><span data-i18n>Veriler</span></button>
  <button data-v="sonuc"><i>∑</i><span data-i18n>Sonuç</span></button>
  <button data-v="hidrolik"><i>⊞</i><span data-i18n>Hidrolik</span></button>
  <button data-v="malzeme"><i>☰</i><span data-i18n>Malzeme</span></button>
  <button data-v="teknik"><i>⌗</i><span data-i18n>Proje</span></button>
</nav>
<div id="toast"></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="js/i18n.js"></script>
<script src="js/i18n-dict.js"></script>
<script src="js/data.js"></script>
<script src="js/pipelib.js"></script>
<script src="js/catalog-data.js"></script>
<script src="js/hydraulics.js"></script>
<script src="js/geom.js"></script>
<script src="js/layout.js"></script>
<script src="js/pipes-data.js"></script>
<script src="js/pipes.js"></script>
<script src="js/catalog.js"></script>
<script src="js/validate.js"></script>
<script src="js/store.js"></script>
<script src="js/engine.js"></script>
<script src="js/drawing.js"></script>
<script src="js/hydro-table.js"></script>
<script src="js/assess.js"></script>
<script src="js/assess-view.js"></script>
<script src="js/report-data.js"></script>
<script src="js/report.js"></script>
<script src="js/hydro-view.js"></script>
<script src="js/hydro-panel.js"></script>
<script src="js/desk.js"></script>
<script src="js/app.js"></script>
<script src="js/platform.js"></script>
</body>
</html>
