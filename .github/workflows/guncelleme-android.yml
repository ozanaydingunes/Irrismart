name: Manuel Shift test APK — 19 üzerine güncelleme (geçici)
# Yalnız birleşik test dalında; main'e birleştirilmeyecek.
on:
  push:
    branches: [claude/manuel-test-20]
  workflow_dispatch:
jobs:
  gun:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: main, path: eski }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - name: Eski APK (main 1.0.6, versionCode 19)
        run: |
          cd eski && APK_OUT=$GITHUB_WORKSPACE/eski.apk bash ci/build-apk.sh
          cd .. && rm -rf eski   # ikinci kaynak kopyası (ve anahtar dosyası) çalışma alanında kalmasın
      - name: Yeni manuel Shift test APK (versionCode 20)
        run: APK_OUT=$GITHUB_WORKSPACE/yeni.apk bash ci/build-apk.sh
      - name: Paket, sürüm ve imza karşılaştırması
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for a in eski yeni; do echo "[GUN] $a: $("$BT/aapt" dump badging $a.apk | head -1)"; echo "[GUN] $a imza: $("$BT/apksigner" verify --print-certs $a.apk 2>&1 | grep -i "SHA-256 digest" | head -1)"; done
          echo "[GUN] yeni APK SHA-256 dosya özeti: $(sha256sum yeni.apk | cut -c1-64)"
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emülatörde 17 → 18 güncelleme
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: node ci/guncelleme-android.js
      - uses: actions/upload-artifact@v4
        if: always() && matrix.api == 34
        with:
          name: IrriGrow-1.0.6-test.20-manuel-shift-apk
          path: yeni.apk
