name: IrriGrow 1.0.7 — Android/masaüstü eşdeğerlik ve 23 → 24 güncelleme testi
# Düzeltme dalında ve elle (main dahil) çalışır. Masaüstü parmak izi (Chromium) ile Android emülatöründeki gerçek WebView parmak izi karşılaştırılır.
on:
  push:
    branches: [claude/irrigrow-code-analysis-vmn8rk]
  workflow_dispatch:
jobs:
  esdeger:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: 996ef007c64a7b53274f7ca1c080a90ac1241311, path: eski }   # main'deki kararlı 1.0.7 (versionCode 23)
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - name: Eski APK (kararlı 1.0.7, versionCode 23)
        run: |
          cd eski && APK_OUT=$GITHUB_WORKSPACE/eski.apk bash ci/build-apk.sh
          cd .. && rm -rf eski   # ikinci kaynak kopyası (ve anahtar dosyası) çalışma alanında kalmasın
      - name: 1.0.7 çoklu parsel test APK'sı (versionCode 24)
        run: APK_OUT=$GITHUB_WORKSPACE/yeni.apk bash ci/build-apk.sh
      - name: Paket, sürüm ve imza
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for a in eski yeni; do echo "[ESD] $a: $("$BT/aapt" dump badging $a.apk | head -1)"; echo "[ESD] $a imza: $("$BT/apksigner" verify --print-certs $a.apk 2>&1 | grep -i 'SHA-256 digest' | head -1)"; done
          echo "[ESD] yeni APK SHA-256 dosya özeti: $(sha256sum yeni.apk | cut -c1-64)"
      - name: Masaüstü parmak izi (Chromium, 1280 px ve 390 px)
        run: |
          npx playwright install chromium
          node test-ui/esdeger.ui.js
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android emülatörü — güncelleme ve eşdeğerlik
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: node ci/esdeger-android.js
      - uses: actions/upload-artifact@v4
        if: always() && matrix.api == 34
        with:
          name: IrriGrow-1.0.7-apk
          path: yeni.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esdeger-${{ matrix.api }}
          path: esdeger-*.json
          if-no-files-found: ignore
