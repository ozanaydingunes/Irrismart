name: Katalog Android depolama testi (geçici)
# Yalnız test dalında çalışır; main'e birleştirilmeyecek. Gerçek Capacitor Filesystem ile katalog depolamasını emülatörde dener.
on:
  push:
    branches: [claude/katalog-android-tani]
  workflow_dispatch:
jobs:
  kat:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - name: APK derlemesi
        env:
          APK_OUT: ${{ github.workspace }}/kat.apk
        run: bash ci/build-apk.sh
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emülatörde katalog depolama testi
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 6000M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r kat.apk
            node ci/katalog-android.js
