name: APK derle

# Kaynak kod artık doğrudan depodadır; irrismart-src.zip yalnız arşiv olarak tutulur ve derlemede kullanılmaz.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testler
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Otomatik testler
        run: npm test

      - name: Hidrolik denetim (tools/audit.js)
        run: node tools/audit.js

  apk:
    name: Debug APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Testler ve APK derlemesi
        env:
          APK_OUT: ${{ github.workspace }}/IrriSmart-AI-debug.apk
        run: bash ci/build-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: IrriSmart-AI-debug-apk
          path: IrriSmart-AI-debug.apk
          if-no-files-found: error
          retention-days: 30
