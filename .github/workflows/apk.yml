name: APK derle

# Kaynak kod artık doğrudan depodadır; irrismart-src.zip yalnız arşiv olarak tutulur ve derlemede kullanılmaz.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testler
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Otomatik testler
        run: npm test

      - name: Hidrolik denetim (tools/audit.js)
        run: node tools/audit.js

  apk:
    name: Debug APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Testler ve APK derlemesi
        env:
          APK_OUT: ${{ github.workspace }}/IrriSmart-AI-debug.apk
        run: bash ci/build-apk.sh

      # APK kimliği: paket adı, sürüm ve imza sertifikası beklenen değerlerle karşılaştırılır.
      # Sertifika, depodaki android/app/irrismart-debug.keystore ile aynı olmalı (eski APK'ların üzerine kurulum için).
      - name: APK doğrulama (paket, sürüm, imza)
        env:
          APK: ${{ github.workspace }}/IrriSmart-AI-debug.apk
          EXPECT_PKG: com.irrigrow.app.dev
          EXPECT_CERT: 457741305275221a657c6594ff0e489316e2b1eef2c184bc4434c4e06bb20b2e
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          ls -l "$APK"
          BADGING=$("$BT/aapt2" dump badging "$APK")
          echo "$BADGING" | grep -E "^(package|sdkVersion|targetSdkVersion|application-label):"
          PKG=$(echo "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          "$BT/apksigner" verify --verbose --print-certs "$APK" | grep -E "Verified|Signer #1 certificate (DN|SHA-256)"
          CERT=$("$BT/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$PKG" = "$EXPECT_PKG" || { echo "HATA: paket adı $PKG (beklenen $EXPECT_PKG)"; exit 1; }
          test "$CERT" = "$EXPECT_CERT" || { echo "HATA: imza sertifikası $CERT (beklenen $EXPECT_CERT)"; exit 1; }
          echo "APK doğrulandı: $PKG, sertifika depodaki debug keystore ile aynı"

      - uses: actions/upload-artifact@v4
        with:
          name: IrriSmart-AI-debug-apk
          path: IrriSmart-AI-debug.apk
          if-no-files-found: error
          retention-days: 30
