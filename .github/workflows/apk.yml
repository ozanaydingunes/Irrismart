name: APK derle

# Kaynak kod artık doğrudan depodadır; irrismart-src.zip yalnız arşiv olarak tutulur ve derlemede kullanılmaz.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testler
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Otomatik testler
        run: npm test

      - name: Hidrolik denetim (tools/audit.js)
        run: node tools/audit.js

  arayuz:
    name: Arayüz testleri (tarayıcı)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Chromium kur (Playwright)
        run: npx playwright install --with-deps chromium

      # Hidrolik paneli: masaüstü (1280 px) ve mobil (390 px) aynı veri, görünürlük, taşma, dokunma hedefi, tema ve karşıtlık
      - name: Arayüz testleri
        run: npm run test:ui

      # MH-WEB-2: 1280/1440/1920 masaüstü düzeni; telefon ve Android'de masaüstü düzeninin etkinleşmediği
      - name: Masaüstü düzeni testleri
        run: npm run test:desk

  apk:
    name: Debug APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Depodaki gradle-wrapper.jar'ın resmi Gradle dağıtımıyla aynı olduğunu doğrular
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Testler ve APK derlemesi
        env:
          APK_OUT: ${{ github.workspace }}/IrriSmart-AI-debug.apk
        run: bash ci/build-apk.sh

      # APK kimliği: paket adı, sürüm, SDK seviyeleri ve imza sertifikası beklenen değerlerle karşılaştırılır.
      # Sertifika, depodaki android/app/irrismart-debug.keystore ile aynı olmalı (eski APK'ların üzerine kurulum için).
      - name: APK doğrulama (paket, sürüm, imza)
        env:
          APK: ${{ github.workspace }}/IrriSmart-AI-debug.apk
          EXPECT_PKG: com.irrigrow.app.dev
          EXPECT_MIN_SDK: '24'
          EXPECT_TARGET_SDK: '36'
          EXPECT_CERT: 457741305275221a657c6594ff0e489316e2b1eef2c184bc4434c4e06bb20b2e
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          ls -l "$APK"
          BADGING=$("$BT/aapt2" dump badging "$APK")
          echo "$BADGING" | grep -E "^(package|sdkVersion|minSdkVersion|targetSdkVersion|application-label):"
          PKG=$(echo "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          VC=$(echo "$BADGING" | sed -n "s/^package: .* versionCode='\([^']*\)'.*/\1/p")
          # aapt2 34 "sdkVersion:", aapt2 36 "minSdkVersion:" yazar
          MIN=$(echo "$BADGING" | sed -n "s/^\(min\)\{0,1\}[sS]dkVersion:'\([^']*\)'/\2/p")
          TGT=$(echo "$BADGING" | sed -n "s/^targetSdkVersion:'\([^']*\)'/\1/p")
          EXPECT_VC=$(sed -n 's/^ *versionCode \([0-9]*\)$/\1/p' android/app/build.gradle)
          "$BT/apksigner" verify --verbose --print-certs "$APK" | grep -E "Verified|Signer #1 certificate (DN|SHA-256)"
          CERT=$("$BT/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$PKG" = "$EXPECT_PKG" || { echo "HATA: paket adı $PKG (beklenen $EXPECT_PKG)"; exit 1; }
          test "$CERT" = "$EXPECT_CERT" || { echo "HATA: imza sertifikası $CERT (beklenen $EXPECT_CERT)"; exit 1; }
          test -n "$EXPECT_VC" && test "$VC" = "$EXPECT_VC" || { echo "HATA: versionCode $VC (beklenen $EXPECT_VC)"; exit 1; }
          test "$MIN" = "$EXPECT_MIN_SDK" || { echo "HATA: minSdk $MIN (beklenen $EXPECT_MIN_SDK)"; exit 1; }
          test "$TGT" = "$EXPECT_TARGET_SDK" || { echo "HATA: targetSdk $TGT (beklenen $EXPECT_TARGET_SDK)"; exit 1; }
          echo "APK doğrulandı: $PKG, versionCode $VC, minSdk $MIN, targetSdk $TGT; sertifika depodaki debug keystore ile aynı"

      - uses: actions/upload-artifact@v4
        with:
          name: IrriSmart-AI-debug-apk
          path: IrriSmart-AI-debug.apk
          if-no-files-found: error
          retention-days: 30
