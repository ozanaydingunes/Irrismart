name: AAB (Play Store)

# K-7 — Play Store için Android App Bundle.
#  • pull_request (android/ veya bu dosya değişince): İMZASIZ AAB yalnız derlenir — yayın derlemesinin bozulmadığını denetler.
#  • workflow_dispatch (elle): kalıcı uygulama kimliği girilir; yükleme anahtarı GitHub gizli değişkenlerinden okunur ve
#    İMZALI AAB üretilir. Gizli değişken yoksa iş durur. Anahtar ve şifreler depoya, koda veya günlüğe yazılmaz.
#  Gerekli gizli değişkenler (Settings → Secrets and variables → Actions):
#    IRRIGROW_UPLOAD_KEYSTORE_B64   yükleme anahtar deposu (.jks), base64
#    IRRIGROW_UPLOAD_STORE_PASSWORD, IRRIGROW_UPLOAD_KEY_ALIAS, IRRIGROW_UPLOAD_KEY_PASSWORD
on:
  workflow_dispatch:
    inputs:
      uygulama_kimligi:
        description: 'Kalıcı uygulama kimliği (ör. com.irrigrow.app) — Play’e yüklendikten sonra değiştirilemez'
        required: true
  pull_request:
    paths:
      - 'android/**'
      - 'ci/build-apk.sh'
      - '.github/workflows/aab.yml'

concurrency:
  group: aab-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  aab:
    name: AAB derlemesi
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Kimlik ve imza ayarı
        env:
          KIMLIK: ${{ github.event.inputs.uygulama_kimligi }}
          KS_B64: ${{ secrets.IRRIGROW_UPLOAD_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.IRRIGROW_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.IRRIGROW_UPLOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.IRRIGROW_UPLOAD_KEY_PASSWORD }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "IRRI_SURUM=$V" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "$KIMLIK" | grep -Eq '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*){2,}$' || { echo "HATA: geçersiz uygulama kimliği"; exit 1; }
            case "$KIMLIK" in *.dev|*.debug|*.test) echo "HATA: Play için geliştirme kimliği kullanılamaz ($KIMLIK)"; exit 1;; esac
            for v in KS_B64 KS_PASS KEY_ALIAS KEY_PASS; do [ -n "${!v}" ] || { echo "HATA: yükleme anahtarı gizli değişkeni eksik ($v)"; exit 1; }; done
            KS="$RUNNER_TEMP/upload.jks"; echo "$KS_B64" | base64 -d > "$KS"
            # Şifreler GITHUB_ENV'e yazılmaz; yalnız derleme adımına doğrudan gizli değişkenlerden verilir
            {
              echo "IRRIGROW_UPLOAD_KEYSTORE=$KS"
              echo "GRADLE_EK=-PirrigrowAppId=$KIMLIK"
              echo "AAB_DOSYA=IrriGrow-$V-release.aab"
              echo "AAB_TUR=imzali"
            } >> "$GITHUB_ENV"
          else
            { echo "GRADLE_EK="; echo "AAB_DOSYA=IrriGrow-$V-imzasiz.aab"; echo "AAB_TUR=imzasiz"; } >> "$GITHUB_ENV"
          fi

      - name: Testler ve AAB derlemesi
        env:
          GOREV: bundleRelease
          IRRIGROW_UPLOAD_STORE_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && secrets.IRRIGROW_UPLOAD_STORE_PASSWORD || '' }}
          IRRIGROW_UPLOAD_KEY_ALIAS: ${{ github.event_name == 'workflow_dispatch' && secrets.IRRIGROW_UPLOAD_KEY_ALIAS || '' }}
          IRRIGROW_UPLOAD_KEY_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && secrets.IRRIGROW_UPLOAD_KEY_PASSWORD || '' }}
          CIKTI: app/build/outputs/bundle/release/app-release.aab
          APK_OUT: ${{ github.workspace }}/${{ env.AAB_DOSYA }}
        run: bash ci/build-apk.sh

      - name: AAB doğrulama
        env:
          AAB: ${{ github.workspace }}/${{ env.AAB_DOSYA }}
        run: |
          ls -l "$AAB"
          unzip -l "$AAB" | grep -q "base/manifest/AndroidManifest.xml" || { echo "HATA: AAB yapısı geçersiz"; exit 1; }
          if [ "$AAB_TUR" = "imzali" ]; then
            jarsigner -verify "$AAB" | grep -q "jar verified" || { echo "HATA: AAB imzası doğrulanamadı"; exit 1; }
            keytool -printcert -jarfile "$AAB" | grep -E "Owner:|SHA256:" | head -2
            echo "AAB imzalı: yükleme anahtarı ile (Play App Signing bunu kendi anahtarıyla yeniden imzalar)"
          else
            echo "AAB imzasız: yalnız derleme denetimi; Play'e yüklenemez"
          fi
          (cd "$(dirname "$AAB")" && sha256sum "$(basename "$AAB")" | tee "$(basename "$AAB").sha256")
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: IrriGrow-${{ env.IRRI_SURUM }}-${{ env.AAB_TUR }}-aab
          path: |
            ${{ env.AAB_DOSYA }}
            ${{ env.AAB_DOSYA }}.sha256
          if-no-files-found: error
          retention-days: 30
